<!doctype html>
<html lang="no">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Julegaver ønsker 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        #controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        #controls button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: 2px solid #e0e0e0;
            background: white;
            color: #333;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #controls button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #gift-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #gift-list li {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        #gift-list li:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        #gift-list li a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        #gift-list li a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        #gift-list li em {
            color: #6c757d;
            font-style: normal;
        }

        .note {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 1.1em;
            font-style: italic;
        }

        .manual-price-badge {
            display: inline-block;
            background: #ff6600;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 8px;
        }

        .price {
            color: #667eea;
            font-weight: bold;
            margin-left: 5px;
        }

        .shop-name {
            color: #6c757d;
            font-style: italic;
            font-size: 0.95em;
            margin-left: 5px;
        }

        .favorite-star {
            color: #ffc107;
            font-size: 1.2em;
            margin-left: 8px;
            vertical-align: middle;
        }

        .product-info {
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 5px;
            padding-left: 0;
        }

        #gift-list li.favorite {
            background: #fff9e6;
            border-left-color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎄 Julegaver ønsker 2025</h1>
        </header>

        <div id="controls" aria-label="Velg person">
            <button data-person="rud">Rud</button>
            <button data-person="katrine">Katrine</button>
            <button data-person="jannic">Jannic</button>
            <button data-person="hjalte">Hjalte</button>
        </div>

        <section>
            <ul id="gift-list" aria-live="polite"></ul>
            <p class="note">Trykk en knapp for å se ønskelisten for den personen.</p>
        </section>
    </div>

    <script>
            // Fetch lists from the local API started by the console app.
            const listEl = document.getElementById('gift-list');
            const buttons = document.querySelectorAll('#controls button');

            // Escape text to avoid accidental HTML injection
            function escapeHtml(str){
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            async function fetchAndRender(personKey){
                listEl.innerHTML = '<li><em>Laster...</em></li>';
                try{
                    const resp = await fetch('/gifts/' + encodeURIComponent(personKey));
                    if(!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
                        const data = await resp.json();
                        console.log('Fetched gifts for', personKey, data);
                            if(!Array.isArray(data) || data.length === 0){
                                listEl.innerHTML = '<li><em>Ingen ønsker registrert.</em></li>';
                            } else {
                                // JSON produced by the .NET API may have PascalCase or camelCase property names depending on serializer settings.
                                // Read properties in a case-tolerant way to avoid 'undefined' showing in the UI.
                                const getString = (obj, ...keys) => {
                                    for (const k of keys) {
                                        if (Object.prototype.hasOwnProperty.call(obj, k) && obj[k] != null) return String(obj[k]);
                                    }
                                    return '';
                                };
                                            const getPrice = (obj) => {
                                                const val = getString(obj, 'Price', 'price');
                                                if (val === '') return '';
                                                return val;
                                            };

                                            const getUrl = (obj) => {
                                                return getString(obj, 'URl', 'Url', 'URL', 'url', 'uRl');
                                            };

                                            const getShopName = (obj) => {
                                                return getString(obj, 'ShopName', 'shopName', 'Shopname');
                                            };

                                            const getIsManualPrice = (obj) => {
                                                const val = obj.IsManualPrice ?? obj.isManualPrice ?? false;
                                                return val === true || val === 'true' || val === 'True';
                                            };

                                            const getIsFavorite = (obj) => {
                                                const val = obj.IsFavorite ?? obj.isFavorite ?? false;
                                                return val === true || val === 'true' || val === 'True';
                                            };

                                            const getProductInfo = (obj) => {
                                                return getString(obj, 'ProductInfo', 'productInfo');
                                            };

                                            // Sort: favorites first
                                            const sortedData = [...data].sort((a, b) => {
                                                const aFav = getIsFavorite(a);
                                                const bFav = getIsFavorite(b);
                                                if (aFav && !bFav) return -1;
                                                if (!aFav && bFav) return 1;
                                                return 0;
                                            });

                                            listEl.innerHTML = sortedData.map(i => {
                                                const produkt = getString(i, 'Produkt', 'produkt', 'Product', 'product', 'Name', 'name');
                                                const price = getPrice(i);
                                                const url = getUrl(i);
                                                const shopName = getShopName(i);
                                                const isManualPrice = getIsManualPrice(i);
                                                const isFavorite = getIsFavorite(i);
                                                const productInfo = getProductInfo(i);
                                                const titleHtml = escapeHtml(produkt || 'Ukjent produkt');
                                                const priceHtml = price ? '<span class="price"> — ' + escapeHtml(String(price)) + ' kr</span>' : '';
                                                const shopHtml = shopName ? '<span class="shop-name"> (fra ' + escapeHtml(shopName) + ')</span>' : '';
                                                const manualPriceNote = isManualPrice ? '<span class="manual-price-badge">manuell pris</span>' : '';
                                                const favoriteStar = isFavorite ? '<span class="favorite-star">⭐</span>' : '';
                                                const productInfoHtml = productInfo ? '<div class="product-info">📝 ' + escapeHtml(productInfo) + '</div>' : '';
                                                const liClass = isFavorite ? 'class="favorite"' : '';

                                                if (url) {
                                                    // render product name as a clickable link
                                                    const href = escapeHtml(url);
                                                    return `<li ${liClass}><a href="${href}" target="_blank" rel="noopener noreferrer">${titleHtml}</a>${priceHtml}${shopHtml}${manualPriceNote}${favoriteStar}${productInfoHtml}</li>`;
                                                }

                                                return `<li ${liClass}>${titleHtml}${priceHtml}${shopHtml}${manualPriceNote}${favoriteStar}${productInfoHtml}</li>`;
                                            }).join('');
                            }
                    buttons.forEach(b => b.classList.toggle('active', b.dataset.person === personKey));
                } catch (err) {
                    listEl.innerHTML = `<li><em>Feil ved henting: ${escapeHtml(err.message)}</em></li>`;
                }
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    fetchAndRender(btn.dataset.person);
                });
            });

            // Initialize with the first person's list visible
            if(buttons.length) fetchAndRender(buttons[0].dataset.person);
    </script>
</body>
</html>
